name: Build mod jar (26.3)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Find project folder
        id: find
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then echo "settings.gradle not found"; exit 1; fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Smoke-check jar
        working-directory: ${{ steps.find.outputs.dir }}/build/libs
        run: |
          JAR=$(ls *.jar | grep -v -- '-sources' | head -n1)
          echo "Built: $JAR"
          unzip -l "$JAR" | grep -E 'fabric.mod.json|AutoFishClient.class'
          unzip -p "$JAR" fabric.mod.json | grep '"version"'
          if unzip -p "$JAR" fabric.mod.json | grep -q '\${version}'; then
            echo "version placeholder not expanded"; exit 1
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoFish-26.3
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error
